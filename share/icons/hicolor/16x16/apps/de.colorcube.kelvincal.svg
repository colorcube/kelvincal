<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- KelvinCal app icon, 16 px variant (GPL-3.0-or-later): screen with warm → cool gradient and the sensor puck -->
  <defs>
    <linearGradient id="k" x1="2" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f47216"/>
      <stop offset="0.5" stop-color="#fcfcfc"/>
      <stop offset="1" stop-color="#3daee9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="2" width="14" height="10" rx="1" fill="#31363b"/>
  <rect x="2" y="3" width="12" height="8" fill="url(#k)"/>
  <rect x="5" y="12" width="6" height="1" fill="#7f8c8d"/>
  <rect x="4" y="13" width="8" height="1" fill="#4d4d4d"/>
  <circle cx="8" cy="7" r="3" fill="#232629"/>
  <circle cx="8" cy="7" r="1.2" fill="#fcfcfc"/>
</svg>
