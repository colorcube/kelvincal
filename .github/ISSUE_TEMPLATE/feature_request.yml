name: Feature request
description: An idea for KelvinCal
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task or problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could KelvinCal help? Screens, options, commands …
