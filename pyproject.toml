[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvincal"
version = "0.1.0"
description = "Modular Wayland-native display calibration, DDC/CI hardware optimizer, and preset switcher (KDE Plasma 6 / GNOME prepared)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "KelvinCal Contributors" }
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kelvincal-cli = "kelvincal.gui.cli:main"
kelvincal = "kelvincal.gui.app:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["kelvincal*"]

[tool.setuptools.package-data]
"kelvincal.gui" = ["i18n/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
