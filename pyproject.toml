[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvincal"
dynamic = ["version"]
description = "Display calibration for KDE Plasma on Wayland: DDC/CI hardware adjustment, ArgyllCMS profiling, presets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "René Fritz", email = "rf@colorcube.de" }
]
keywords = ["display calibration", "color management", "icc", "argyllcms", "ddc/ci", "kde", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/colorcube/kelvincal"
Issues = "https://github.com/colorcube/kelvincal/issues"
Changelog = "https://github.com/colorcube/kelvincal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kelvincal-cli = "kelvincal.gui.cli:main"
kelvincal = "kelvincal.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "kelvincal.__version__" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["kelvincal*"]

[tool.setuptools.package-data]
"kelvincal.gui" = ["i18n/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
